name: Release

# Manual on purpose. The versioning half of the release stays local: a bot-opened
# "Version Packages" pull request is created with GITHUB_TOKEN, which does not
# trigger workflows, so the `verify` check required by the main ruleset would
# never report and that pull request could never be merged. Until the ruleset
# grows a bypass or this uses a PAT, the flow is:
#
#   1. branch, `yarn run version` (with the `run` — see AGENTS.md), pull request, merge
#   2. run this workflow against main
on:
  workflow_dispatch:

permissions:
  contents: write # pushes the version tag
  id-token: write # OIDC token for npm trusted publishing (also gives provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `registry-url:` here, and do not add one back. It makes setup-node write an
      # .npmrc containing `_authToken=${NODE_AUTH_TOKEN}`, and this workflow has no token
      # by design. yarn classic expands that .npmrc before running anything and dies on
      # the unset variable — "Failed to replace env in config" — so `cache: yarn` fails
      # inside setup-node itself, before a single step of ours runs. Nothing is lost:
      # registry.npmjs.org is npm's default, and it is where the OIDC exchange happens.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      # Node 22 ships npm 10.x; trusted publishing needs >= 11.5.1. changesets
      # shells out to npm for the publish, so upgrading npm here is what
      # enables OIDC for `yarn release`.
      - run: npm install -g npm@latest

      # --ignore-scripts: lifecycle scripts of freshly installed packages are
      # the supply-chain vector (see the 2026 keyv/flat-cache compromises).
      # Nothing in this dependency tree needs them; tests and build stay green.
      - run: yarn install --frozen-lockfile --ignore-scripts

      # A pending changeset means main was never versioned, so package.json still
      # holds the previous number and publishing now would ship the new code under
      # the old version — or, more likely, do nothing at all and look like it worked.
      - name: Refuse to publish an unversioned main
        run: |
          pending=$(find .changeset -name '*.md' ! -name README.md | wc -l | tr -d ' ')
          if [ "$pending" != "0" ]; then
            echo "::error::$pending changeset(s) still pending. Run 'yarn run version' on a branch, merge it, then release."
            exit 1
          fi

      - run: yarn typecheck
      - run: yarn test

      # `prepublishOnly` builds, so dist/ is made by the publish itself and cannot
      # drift from what is being shipped.
      #
      # No NODE_AUTH_TOKEN anywhere on purpose: the package authenticates with
      # npm trusted publishing (OIDC) — the `id-token: write` permission above
      # lets npm verify this exact workflow in this exact repo, and provenance
      # comes attached automatically. A stolen long-lived NPM_TOKEN is how the
      # recent npm worms republished other people's packages; there is no token
      # here to steal. The trusted publisher is configured on npmjs.com (package
      # settings → Trusted Publisher → GitHub Actions → this file on main).
      - run: yarn release

      # `changeset publish` tags the release locally; nothing pushes it for us.
      - run: git push --follow-tags

      # The MCP Registry entry goes last, and in this job rather than a workflow of its
      # own triggered by the tag above: a tag pushed with GITHUB_TOKEN does not trigger
      # workflows, the same reason the versioning half of this release is manual. Being
      # in the same job also gets the required order for free — the registry rejects the
      # manifest unless the tarball already on npm carries a matching `mcpName`, and by
      # here `yarn release` has published it.
      #
      # Pinned by version and by checksum, not `releases/latest/download`. This job holds
      # `contents: write` and `id-token: write`, so an unpinned binary fetched from the
      # internet and run here could push to main and mint tokens in our name. Upgrading
      # is a commit someone reviews; take the new sha256 from the release's
      # registry_<version>_checksums.txt.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: 1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      # No token: `login github-oidc` exchanges the Actions OIDC token for a registry
      # one, and the registry grants the io.github.gCuadros namespace because the token
      # says this repository. Same trade as npm trusted publishing above.
      - run: ./mcp-publisher login github-oidc

      # Reads server.json, whose version `yarn run version` does not touch — it is bumped
      # by hand on the release branch, and src/registryManifest.test.ts fails if it drifts
      # from package.json. That test already ran two steps ago.
      - run: ./mcp-publisher publish
