version: 2

updates:
  # Actions are pinned to mutable major tags (@v7). Dependabot is what turns that
  # into a visible pull request instead of a silent change under the same tag —
  # and what stops them ageing out: v4 was already running on a deprecated Node.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # Grouped and monthly: this is a small dependency tree, and one pull request a
  # month that CI has already type-checked, tested and packed is reviewable.
  # Ungrouped weekly updates on a repo with a required check are just noise.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # TypeScript 7 is the native port, and it dropped the classic JS compiler
      # API: `ts.sys` and `ts.readConfigFile` are both undefined on 7.0.2, where
      # 6.0.3 has them. Vercel's zero-config Node builder type-checks the project
      # by calling `ts.readConfigFile(tsconfig, ts.sys.readFile)` from
      # @vercel/backends, so on TypeScript 7 every deployment dies with
      # "Cannot read properties of undefined (reading 'readFile')" — after our own
      # build has already succeeded. Nothing in this repo can work around it.
      #
      # Lift this once @vercel/backends handles TypeScript 7; re-check by bumping
      # typescript locally and watching a preview deployment, not just CI. CI
      # passes on 7 — it was a green `verify` that let this through.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      # Majors stay out of both groups, so they arrive as their own pull request.
      # Dependabot still opens them — being excluded from a group means ungrouped,
      # not ignored. The first batch proved why: a TypeScript 6 → 7 bump, a whole
      # compiler swap under `exactOptionalPropertyTypes` and
      # `noUncheckedIndexedAccess`, rode in with three patch updates.
      dev-dependencies:
        dependency-type: development
        patterns: ["*"]
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        patterns: ["*"]
        update-types: [minor, patch]
